services:
  db:
    image: postgres:16-alpine
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    env_file:
      - .env
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
    #  - postgres_data:/var/lib/postgresql/data
      - ../init:/docker-entrypoint-initdb.d
      - "C:/Users/Florin/OneDrive - FHNW/P-pro2Db_Ausfälle-in-Schlammtrockungsanlage_M365 - STRAG AG/Data/Logger:/import_data"

volumes:
  postgres_data:
