default:
  image: python:3.13
  before_script:
  - pip install uv
  - uv sync --all-groups --all-extras

stages:
- lint
- test

ruff:
    stage: lint
    script:
    - uv run ruff format --check .
    - uv run nbqa ruff .

unittest:
    stage: test
    services:
    before_script:
    - pip install uv
    - uv sync --all-groups --all-extras
    - python db/sqlite/create_sqlite_load_csv.py
    script:
    - uv run pytest
    - uv run python scripts/use_utils_package.py

