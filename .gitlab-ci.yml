default:
  image: python:3.13
  before_script:
  - pip install uv
  - uv sync --all-groups --all-extras

stages:
- lint
- test

ruff:
    stage: lint
    script:
    - uv run ruff format --check .
    - uv run nbqa ruff .

unittest:
    stage: test
    script:
    - uv run pytest --verbose --ignore=test/test_db_connection.py

