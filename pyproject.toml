[project]
name = "pro2db-ausfaelle-in-schlammtrocknungsanlage"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pandas >= 2.2.3",
    "matplotlib >= 3.10.1",
    "dash >= 4.0.0",
    "pre-commit>=4.5.1",
]

[project.optional-dependencies]
    dev = [
        
        # Linting
        "ruff >= 0.14.1",
        "mypy >= 1.15.0",
        "mypy-extensions >= 1.0.0",
        "pydoclint >= 0.6.6",
        "nbqa >= 1.9.1",
        
        # Test framework
        "pytest >= 7.1.3",
    ]

[tool.ruff]
# Enable common rules
line-length = 100
target-version = "py311"  # Adjust to your Python version

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
]

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = [
    "E501",  # Line too long (notebooks often have long lines for readability)
    "B018",  # Useless expression (common for display purposes in notebooks)
    "F401",  # Imported but unused (exploratory imports are common)
    "T201",  # Allow print statements in notebooks
    "E703",  # Allow semicolons (used to suppress output)
]

[tool.nbqa.config]
# Black configuration for notebooks
black = "pyproject.toml"
ruff = "pyproject.toml"

[tool.nbqa.mutate]
# Allow nbqa to modify notebooks in place
black = 1
ruff = 1
isort = 1
