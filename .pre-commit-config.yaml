repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
    -   id: check-added-large-files
        args: [--maxkb=2048]
    -   id: no-commit-to-branch
        args: [--branch, main]


-   repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.14
    hooks:

    -   id: ruff-check
        args: [ --fix ]

    -   id: ruff-format


